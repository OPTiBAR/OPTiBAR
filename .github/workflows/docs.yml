name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # only the docs group: Sphinx doesn't import OPTiBAR, so the app's dependencies aren't needed
      - name: Build documentation
        run: uv run --frozen --only-group docs sphinx-build -b html docs/source docs/build/html

      - name: Deploy to GitHub Pages
        run: uvx ghp-import -n -p -f docs/build/html
