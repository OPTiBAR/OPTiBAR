name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the Microsoft Access ODBC driver
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\accessdatabaseengine_X64.exe"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/3/5/C/35C84C36-661A-44E6-9324-8786B8DBE231/accessdatabaseengine_X64.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet", "/norestart" -Wait
          Get-OdbcDriver -Platform 64-bit | Where-Object Name -like "*Access*" | Select-Object Name

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Check the driver is visible to pyodbc
        run: uv run python -c "from optibar.core.parser.parse import has_access_driver; assert has_access_driver(), 'Access ODBC driver not found'"

      - name: Parser, sketch and cutting tests
        run: uv run pytest src/optibar/core/tests/parser src/optibar/core/tests/sketch src/optibar/core/tests/cutting -v -p no:cacheprovider

      - name: GUI tests
        run: uv run pytest src/optibar/gui/tests -v -p no:cacheprovider

      # the legacy engine tests predate the refactor and have known failures; reported, not blocking
      - name: Legacy engine tests
        continue-on-error: true
        run: uv run pytest src/optibar/core/tests/components src/optibar/core/tests/io src/optibar/core/tests/optimization -q -p no:cacheprovider
