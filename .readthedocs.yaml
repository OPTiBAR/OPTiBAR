# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Install the docs dependency group of pyproject.toml with uv, as locked in uv.lock.
# Only the docs group: Sphinx doesn't import OPTiBAR, so the app's dependencies aren't needed.
# See https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --only-group docs

sphinx:
  configuration: docs/source/conf.py
