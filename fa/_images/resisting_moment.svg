<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 687" width="1152" height="687">
  <title>The resisting moment of a cantilever follows its bars</title>
  <defs>
    <marker id="arrow" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0L12 4L0 8L3 4Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1152" height="687" fill="#ffffff"/>

  <g stroke="#000000" stroke-width="2" fill="none">
    <!-- distributed load -->
    <path d="M6 15.5H882"/>
    <g marker-end="url(#arrow)"><path d="M6 15.5V56"/><path d="M52.5 15.5V56"/><path d="M100 15.5V56"/><path d="M147.5 15.5V56"/><path d="M195 15.5V56"/><path d="M242.5 15.5V56"/><path d="M290 15.5V56"/><path d="M337 15.5V56"/><path d="M384.5 15.5V56"/><path d="M432 15.5V56"/><path d="M479.5 15.5V56"/><path d="M527 15.5V56"/><path d="M574.5 15.5V56"/><path d="M622 15.5V56"/><path d="M669.5 15.5V56"/><path d="M716.5 15.5V56"/><path d="M764 15.5V56"/><path d="M811.5 15.5V56"/><path d="M859 15.5V56"/></g>
    <!-- cantilever, with the column below its left end and a break at its right end -->
    <path d="M5 56.5H881M5 194.5H881"/>
    <path d="M5 15.5V297L22 294L42 302L62 294L80 301L90.5 298V194.5"/>
    <path d="M881 0V107L870 119L892.5 127.5L881 135V227"/>
    <!-- effective depth -->
    <path marker-end="url(#arrow)" d="M954 102V57"/>
    <path marker-end="url(#arrow)" d="M954 131V175"/>
    <!-- section -->
    <rect x="1020.5" y="55.5" width="130" height="145" stroke-width="1.5"/>
  </g>
  <g fill="#999999">
    <circle cx="1045" cy="177" r="5"/><circle cx="1066" cy="177" r="5"/><circle cx="1086" cy="177" r="5"/><circle cx="1107" cy="177" r="5"/><circle cx="1127" cy="177" r="5"/>
  </g>

  <!-- bars -->
  <path stroke="#000d8e" stroke-width="2" fill="none" d="M28.5 177H881M232 165.5H881M510.5 157H881"/>
  <path stroke="#000000" stroke-width="2" fill="none" d="M126.5 177V150.5H159M384.5 165.5V139.5H417M611 157V130.5H644"/>
  <g font-family="'Times New Roman', Times, serif" font-size="20" fill="#000000">
    <text x="163" y="158">2 bars</text>
    <text x="421" y="147">2 bars</text>
    <text x="648" y="138">1 bar</text>
    <text x="946" y="125" font-style="italic" font-size="24">d</text>
  </g>

  <!-- bar ends and the face of the column -->
  <g stroke="#000000" stroke-width="1" fill="none">
    <path stroke-dasharray="7 5" d="M28.5 177V680M232 165.5V542M510.5 157V405"/>
    <path stroke-dasharray="14 4 3 4" stroke-width="1.5" d="M46 300V680"/>
  </g>

  <!-- development lengths -->
  <g stroke="#000000" stroke-width="1.2" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M30 504.5H140"/>
    <path d="M233 345H341"/>
    <path d="M511 313.5H617"/>
  </g>
  <g font-family="'Times New Roman', Times, serif" font-size="22" fill="#000000">
    <text x="70" y="488">L<tspan font-size="16" dy="6">d</tspan></text>
    <text x="274" y="333">L<tspan font-size="16" dy="6">d</tspan></text>
    <text x="547" y="300">L<tspan font-size="16" dy="6">d</tspan></text>
  </g>

  <!-- axes -->
  <path stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M6.5 680V369"/>
  <path stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" d="M6 680H860"/>

  <!-- resisting moment and factored moment -->
  <path stroke="#000000" stroke-width="2" fill="none" stroke-linejoin="round" d="M28 680L146 542H232L343 405H511L622 337.5H858"/>
  <path stroke="#f10000" stroke-width="2" fill="none" d="M46 680C200 560 560 345 858 337.5"/>

  <!-- callouts -->
  <g stroke="#000000" stroke-width="1" fill="none">
    <path d="M488 346H520C540 346 550 360 549 382"/>
    <path d="M419 457C422 478 450 487 488 487"/>
  </g>
  <g font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="18" fill="#000000">
    <text x="393" y="350">ϕM<tspan font-size="13" dy="4">n</tspan></text>
    <text x="405" y="368">diagram</text>
    <text x="492" y="476">Factored moment diagram</text>
    <text x="492" y="503">M<tspan font-size="13" dy="4">u</tspan></text>
  </g>
</svg>
