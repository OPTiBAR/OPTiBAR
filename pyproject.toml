[project]
name = "optibar"
version = "0.1.0"
description = "Automated, optimized rebar detailing for concrete foundations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.4.5",
    "highspy>=1.16.0",
    "matplotlib>=3.11.2",
    "packaging>=26.3",
    "pillow>=13.0.0",
    "pycairo>=1.29.2",
    "pyodbc>=5.5.0",
    "pyomo>=6.10.1",
    "shapely>=2.2.0",
    "sv-ttk>=2.6.1",
]

[project.gui-scripts]
optibar = "optibar.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optibar"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pypdf>=7.0.1",
    "pytest>=9.2.0",
]
