[project]
name = "optibar"
version = "0.1.0"
description = "Automated, optimized rebar detailing for concrete foundations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ezdxf>=1.4.5",
    "highspy>=1.12.0",
    "matplotlib>=3.11.2",
    "packaging>=26.3",
    "pillow>=13.0.0",
    "pycairo>=1.29.2",
    "pyodbc>=5.3.0",
    "pyomo>=6.9.5",
    "shapely>=2.1.2",
    "sv-ttk>=2.6.1",
    "texttable>=1.7.1",
]

[project.gui-scripts]
optibar = "optibar.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optibar"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
]
